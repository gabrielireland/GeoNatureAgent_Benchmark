experiment_id: "exp_035_gemini25_pro_v5_seeds5"
description: "Gemini 2.5 Pro via Vertex AI — Full v5 benchmark, 5 seeds for variance"
based_on: "exp_035_gemini25_pro_v5"

model:
  model_id: "vertex_ai/gemini-2.5-pro"
  max_tokens: 4096

sampling:
  temperature: 1.0
  seeds: [42, 1337, 2024]

vertex:
  region: us-central1

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments_seeds5"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
