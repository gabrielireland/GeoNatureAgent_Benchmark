experiment_id: "exp_037_llama4_maverick_v5"
description: "Llama 4 Maverick 17B-128E via Vertex AI MaaS — Full v5 benchmark (93 cases, 18 categories, 12 tools)"
based_on: "exp_030_llama4_maverick_geobenchx_v1"

model:
  model_id: "vertex_ai/meta/llama-4-maverick-17b-128e-instruct-maas"
  max_tokens: 4096

sampling:
  temperature: 1.0

vertex:
  region: us-east5

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
