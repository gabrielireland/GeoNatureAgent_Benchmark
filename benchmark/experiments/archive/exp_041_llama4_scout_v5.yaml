experiment_id: "exp_041_llama4_scout_v5"
description: "Llama 4 Scout 17B-16E via Vertex AI MaaS — Full v5 benchmark (93 cases, 18 categories, 12 tools)"
based_on: "exp_034_llama4_scout_geobenchx_v1"

model:
  model_id: "vertex_ai/meta/llama-4-scout-17b-16e-instruct-maas"
  max_tokens: 4096

sampling:
  temperature: 1.0

vertex:
  region: us-east5

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
