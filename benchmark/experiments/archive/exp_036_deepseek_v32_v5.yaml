experiment_id: "exp_036_deepseek_v32_v5"
description: "DeepSeek V3.2 via Vertex AI MaaS — Full v5 benchmark (93 cases, 18 categories, 16 tools)"
based_on: "exp_029_deepseek_v32_geobenchx_v1"

model:
  model_id: "vertex_ai/deepseek-ai/deepseek-v3.2-maas"
  max_tokens: 4096

sampling:
  temperature: 1.0

vertex:
  region: global

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
