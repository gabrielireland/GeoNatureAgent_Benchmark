experiment_id: "exp_038_gpt_oss_120b_v5"
description: "OpenAI GPT-OSS 120B via Vertex AI MaaS — Full v5 benchmark (93 cases, 18 categories, 16 tools)"
based_on: "exp_031_gpt_oss_120b_geobenchx_v1"

model:
  model_id: "vertex_ai/openai/gpt-oss-120b-maas"
  max_tokens: 4096

sampling:
  temperature: 1.0

vertex:
  region: us-central1

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
