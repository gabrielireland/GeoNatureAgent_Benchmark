experiment_id: "exp_042_claude_sonnet4_v5"
description: "Claude Sonnet 4 via Anthropic API — Full v5 benchmark (93 cases, 18 categories, 12 tools)"
based_on: "exp_035_gemini25_pro_v5"

model:
  model_id: "claude-sonnet-4-20250514"
  max_tokens: 4096

sampling:
  temperature: 1.0

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
