experiment_id: "exp_036_deepseek_v32_v5_seeds5"
description: "DeepSeek V3.2 via Vertex AI MaaS — Full v5 benchmark, 5 seeds for variance"
based_on: "exp_036_deepseek_v32_v5"

model:
  model_id: "vertex_ai/deepseek-ai/deepseek-v3.2-maas"
  max_tokens: 4096

sampling:
  temperature: 1.0
  seeds: [42, 1337, 2024]

vertex:
  region: us-central1

agent:
  architecture:    single_agent
  prompt_strategy: zero_shot
  prompt_version:  v3
  max_turns:       10

tasks:
  case_set: v5

output:
  prefix: "GeoNatureAgent/experiments_seeds5"
  log_to_bigquery: true
  bigquery_dataset: "geoagentbench"
  bucket: "geonature-agent-results"
