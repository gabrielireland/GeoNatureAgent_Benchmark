    run_dir: run_20260512_205403
    cloudbuild_id: 9dd5c809-4f3b-44ba-9943-cff2a636d705

  Qwen3-235B:
    experiment_id: exp_040_qwen3_235b_v5_seeds5
    run_dir: run_20260512_205350
    cloudbuild_id: 8b324d60-865e-4252-8909-028af58a3c93

  Llama 4 Scout:
    experiment_id: exp_041_llama4_scout_v5_seeds5
