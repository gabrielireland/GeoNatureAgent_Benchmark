# Source-of-truth manifest for the paper's final benchmark numbers.
#
# Each entry pins a model's published leaderboard number to a specific
# Cloud Run results folder in GCS. Re-running scripts/compile_final_results.py
# against this file regenerates leaderboard.csv / per_category.csv / per_case.csv
# byte-for-byte (modulo float formatting), enabling reviewer-side reproducibility.
#
# Six models (those whose provider implements deterministic seeding via Vertex
# MaaS) are evaluated under three seeds {42, 1337, 2024}. Claude Sonnet 4 is
# accessed via the Anthropic Messages API, which does not expose a `seed`
# parameter; we therefore use two independent temperature-1.0 samples for that
# model. The compile script honors the optional `seeds` filter when present.

bucket: geonature-agent-results

models:
  Gemini 2.5 Pro:
    experiment_id: exp_035_gemini25_pro_v5_seeds5
    run_dir: run_20260512_205246
    cloudbuild_id: 87d411f7-8328-456f-b350-e3f334172eb6

  DeepSeek V3.2:
    experiment_id: exp_036_deepseek_v32_v5_seeds5
    run_dir: run_20260512_205259
    cloudbuild_id: 15bb6797-e9ed-4549-976e-b4acee11d48e

  GPT-OSS-120B:
    experiment_id: exp_038_gpt_oss_120b_v5_seeds5
    run_dir: run_20260512_205327
    cloudbuild_id: ab42f9ac-de6c-4659-b583-65c04b51e3ac

  GLM-5:
